<html>
  <head>
    <title>Primeira experiencia de RA usando o AR.js e o A-Frame</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow; hidden">
    <a-scene vr-mode-ui="enable: false" embedded arjs="debugUIEnable: false">
      <a-marker preset="hiro">
        <a-box position="0 0.5 0" color="black";></a-box>
        <a-sphere position="1 1 0" color="white";></a-sphere>
        <a-text value="Ola Mundo!" position="-0.5 1.2 0" color="yellow"></a-text>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
    
  </body>
</html>
