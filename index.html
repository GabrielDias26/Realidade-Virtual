<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>RA com GIF do Coyote</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://rawgit.com/mayognaise/aframe-gif-shader/master/dist/aframe-gif-shader.min.js"></script>
  </head>
  
  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; videoSettings: {facingMode: 'environment'}">
      
      <a-assets>
        <img id="coyote" src="https://media.tenor.com/yS7S9mZis70AAAAC/spurs-spurscoyote.gif">
      </a-assets>

      <a-marker preset="hiro">
        <a-entity 
          geometry="primitive: plane; width: 2; height: 2" 
          position="0 0.5 0" 
          rotation="-90 0 0"
          material="shader: gif; src: #coyote; transparent: true; opacity: 1;">
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
      
    </a-scene>
  </body>
</html>
