<!DOCTYPE html>
<html>
  <head>
    <title>RA com GIF do Coyote</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://rawgit.com/mayognaise/aframe-gif-shader/master/dist/aframe-gif-shader.min.js"></script>
  </head>
  
  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <img id="coyote" src="https://media.tenor.com/yS7S9mZis70AAAAC/spurs-spurscoyote.gif">
      </a-assets>

      <a-marker preset="hiro">
        <a-entity 
          geometry="primitive: plane; width: 1.5; height: 1.5" 
          position="0 1 0" 
          material="shader: gif; src: #coyote; transparent: true; side: double;">
        </a-entity>
        
        <a-box position="0 0.25 0" scale="0.5 0.5 0.5" color="black"></a-box>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
